version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-4
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
blocks:
  - name: Install dependencies
    dependencies: []
    task:
      jobs:
        - name: "\U0001F7E2 Run Tests"
          commands:
            - pip install pytest requests flask coverage locust
            - 'export PATH=$PATH:/home/semaphore/.local/bin '
  - name: "\U0001F680 Deploy"
    dependencies:
      - Install dependencies
    task:
      jobs:
        - name: Run Unit Tests
          commands:
            - cd 1-tdd && python -m pytest test_factorial.py -v
            - cd 2-unit-testing && python -m pytest test_math_sum.py -v
