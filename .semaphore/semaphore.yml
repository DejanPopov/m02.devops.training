version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-4
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
blocks:
  - name: Install dependencies
    dependencies: []
    task:
      jobs:
        - name: Install python dependencies
          commands:
            - checkout
            - pip install pytest requests flask coverage locust
            - 'export PATH=$PATH:/home/semaphore/.local/bin'
  - name: Run Unit Tests
    dependencies:
      - Install dependencies
    task:
      jobs:
        - name: Run Unit Tests
          commands:
            - checkout
            - cd 1-tdd && python -m pytest test_factorial.py -v
            - cd 2-unit-testing && python -m pytest test_math_sum.py -v
  - name: Run Integration Tests
    dependencies:
      - Run Unit Tests
    task:
      jobs:
        - name: Run Integration Tests
          commands:
            - checkout
            - 'cd 3-integration-testing && python -m pytest test_integration.py -v '
            - cd 6-mocking && python -m pytest test_weather_service.py -v
  - name: Run End-to-End Tests
    dependencies:
      - Run Integration Tests
    task:
      jobs:
        - name: Run End-to-End Tests
          commands:
            - checkout
            - 'cd 4-e2e && nohup python app.py & '
            - 'sleep 3 '
            - cd 4-e2e && python -m pytest test_e2e.py -v
  - name: Run Test Coverage
    dependencies:
      - Run End-to-End Tests
    task:
      jobs:
        - name: Run Test Coverage
          commands:
            - checkout
            - cd 7-test-coverage && coverage run -m pytest test_calculator.py -v
            - cd 7-test-coverage && coverage report -m
  - name: Run Test Reports
    dependencies:
      - Run Test Coverage
    task:
      jobs:
        - name: Run Test Reports
          commands:
            - checkout
            - cd 5-test-reports && pip install -r requirements.txt
            - cd 5-test-reports && pytest --junitxml=reports.xml
            - 'cd 5-test-reports && [[ -f reports.xml ]] && test-results publish reports.xml'
after_pipeline:
  task:
    jobs:
      - name: After pipeline job
        commands:
          - 'test-results gen-pipeline-report '
